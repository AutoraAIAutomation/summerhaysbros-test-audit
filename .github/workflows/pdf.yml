name: Render PDF
on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency: pdf
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund puppeteer@23
      - run: |
          cat > render.js <<'JS'
          const puppeteer = require('puppeteer'); const path = require('path');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'networkidle0', timeout: 90000 });
            await page.emulateMediaType('print');
            await page.evaluate(() => document.fonts && document.fonts.ready);
            await new Promise(r => setTimeout(r, 1500));
            await page.pdf({ path: 'summerhaysbros-monetisation-audit.pdf', format: 'A4', printBackground: true, preferCSSPageSize: true, margin: { top: 0, right: 0, bottom: 0, left: 0 } });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node render.js
      - run: |
          git config user.name 'audit-bot'
          git config user.email 'audit-bot@autoraaiautomation.com'
          git add '*.pdf'
          git commit -m 'Render PDF [skip ci]' || echo 'PDF unchanged'
          git push
